apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkding
  namespace: linkding
spec:
  ingressClassName: traefik
  rules:
    # fester Name (im LAN via Fritz!Box aufloesbar)
    - host: raspberrypi.fritz.box
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkding
                port:
                  number: 9090
    # zusaetzlich Catch-all: Zugriff direkt ueber die Host-IP
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkding
                port:
                  number: 9090
