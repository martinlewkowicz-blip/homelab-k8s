apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkding
  namespace: linkding
spec:
  interval: 30m
  chart:
    spec:
      chart: linkding
      version: ">=1.0.0"
      sourceRef:
        kind: HelmRepository
        name: linkding
        namespace: linkding
  values:
    persistence:
      enabled: true
      size: 2Gi
