apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkding
  namespace: linkding
spec:
  interval: 30m
  chart:
    spec:
      chart: linkding
      version: "3.0.0"
      sourceRef:
        kind: HelmRepository
        name: linkding
        namespace: linkding
  values:
    persistentVolumeClaim:
      create: false
      existingPersistentVolumeClaim: linkding-data
    service:
      type: NodePort
    ports:
      http:
        nodePort: 30090
