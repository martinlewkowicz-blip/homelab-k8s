apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-pi
  namespace: ollama-pi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-pi
  template:
    metadata:
      labels:
        app: ollama-pi
    spec:
      nodeSelector:
        kubernetes.io/hostname: raspberrypi
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_KEEP_ALIVE
              value: "5m"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-pi-models
